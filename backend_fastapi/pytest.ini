[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    unit: Unit tests
    integration: Integration tests
    auth: Authentication tests
    company: Company service tests
    client: Client service tests
    category: Category service tests
    ordering: Ordering service tests
    review: Review service tests
    chat: Chat service tests
    file: File service tests
